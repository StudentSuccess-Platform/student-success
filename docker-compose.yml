# StudentSuccess in Docker: one command starts the app (about 1.6 GB of images).
#   docker compose up -d --build
# Then open http://localhost:8080 (sign in with a seeded user, see docs/setup/local-development.md).
#
# What starts:
#   mongo   MongoDB 7
#   seed    one-shot: loads synthetic demo data when the database is empty (never wipes existing data)
#   api     the Express API on :3000
#   web     the React app served by nginx on :8080
#
# AI plans use a local Ollama (or OpenAI when OPENAI_API_KEY and LLM_MODEL are set and OpenAI answers). Ollama is NOT
# bundled by default because its image is about 8 GB. Without it, "Generate AI recommendation" falls back to the manual form.
#   Option 1 (recommended): install Ollama on this machine, run `ollama pull gemma3:1b`. The API reaches it through
#            host.docker.internal:11434 with no further setup.
#   Option 2: run Ollama in Docker too (adds the ollama image and downloads the model on first start):
#            docker compose -f docker-compose.yml -f docker-compose.ai.yml up -d --build
#            (GPU: add -f docker-compose.nvidia.yml or -f docker-compose.amd.yml, or run sh scripts/setup/ollama-up.sh)
#
# Every host port and the model can be changed with environment variables (or a .env file next to this file):
#   WEB_PORT API_PORT MONGO_PORT  OLLAMA_MODEL  LLM_BASE_URL  JWT_SECRET  OPENAI_API_KEY (+ LLM_MODEL to use OpenAI)
#   BIND_ADDRESS (default 127.0.0.1: only this machine can reach the ports; it also avoids a Docker Desktop on Windows
#   problem where http://localhost hangs because localhost resolves to IPv6. Use 0.0.0.0 to share on your network.)
name: studentsuccess

services:
  mongo:
    image: mongo:7
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: seed
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/studentsuccess
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/studentsuccess
      # The browser calls the API from the web app's address.
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
      # A local development secret. Set JWT_SECRET to your own value for anything that is shared.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      # OpenAI is used only when OPENAI_API_KEY and LLM_MODEL are set and OpenAI answers; otherwise the API uses ollama.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # Ollama on this machine by default; docker-compose.ai.yml points it at the ollama container instead.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:1b}
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux; Docker Desktop already provides this name
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # The address the browser uses to reach the API (not a container name).
        VITE_API_URL: http://localhost:${API_PORT:-3000}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  mongo-data:
