# Local development stack.
#   docker compose up -d            -> mongo + api
#   docker compose --profile ai up  -> also starts a local Ollama
# The API does not connect to MongoDB yet (SCRUM-11); mongo is provisioned for it.
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/studentsuccess
      CORS_ORIGIN: http://localhost:5173
      LLM_PROVIDER: ollama
      LLM_BASE_URL: http://ollama:11434
      LLM_MODEL: ""
    depends_on:
      mongo:
        condition: service_healthy

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.5.12
    ports:
      - "11434:11434"
    environment:
      # Ollama splits a model across GPU and CPU automatically when it does not fit in VRAM.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    volumes:
      - ollama-data:/root/.ollama

  # web is intentionally not defined yet: the frontend scaffold (apps/web) does
  # not exist. Add a `web` service here once apps/web has a Vite project.

volumes:
  mongo-data:
  ollama-data:
