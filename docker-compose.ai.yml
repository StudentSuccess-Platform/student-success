# Adds a local Ollama to the stack (about 8 GB image plus the model). Use it on top of the base file:
#   docker compose -f docker-compose.yml -f docker-compose.ai.yml up -d --build
# The ollama-pull service downloads the model into the ollama-data volume on first start (gemma3:1b is about 0.8 GB).
# Watch it with: docker compose -f docker-compose.yml -f docker-compose.ai.yml logs -f ollama-pull
# Add -f docker-compose.nvidia.yml or -f docker-compose.amd.yml for a GPU (or run sh scripts/setup/ollama-up.sh).
# If you already run Ollama on this machine, stop it or set OLLAMA_PORT, because both use port 11434.
services:
  api:
    environment:
      LLM_BASE_URL: http://ollama:11434

  ollama:
    image: ollama/ollama:0.32.12
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    environment:
      # Ollama splits a model across GPU and CPU automatically when it does not fit in VRAM.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 10s

  ollama-pull:
    image: ollama/ollama:0.32.12
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-gemma3:1b}"]
    restart: "no"

volumes:
  ollama-data:
